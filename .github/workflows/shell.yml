name: Shell

# deploy.sh and release.sh COMMIT to this repository, and until #3 nothing so
# much as parsed them before running. This job is the per-PR gate the issue
# asked for: `bash -n` over every tracked script (Tools/tests/shell-syntax.sh,
# the same command a human runs locally) plus ShellCheck at warning severity.
#
# ubuntu, deliberately: it bills at the 1x multiplier and finishes in seconds,
# so it does not reopen the macOS-minutes question that once removed per-PR CI
# (see l1.yml's history note). Scripts here are plain bash — nothing needs
# macOS to parse.
#
# Same fork-safety posture as l1.yml: `pull_request` (never
# `pull_request_target`), read-only permissions, no secrets read.
on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/shell.yml'
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell.yml'
  workflow_dispatch:

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Parse every tracked script (bash -n)
        run: Tools/tests/shell-syntax.sh

      - name: ShellCheck
        # Warning severity: the repo is clean at this level (made so in #3's
        # PR), and style-level chatter would teach people to ignore the job.
        run: git ls-files '*.sh' | xargs shellcheck --severity=warning

  # The L0 failure-window suite (GitHub #18): deploy.sh and release.sh COMMIT
  # to this repository, and the suite proves the build-number invariant
  # survives failure at every point — by making each point fail. It stubs
  # xcrun/xcodebuild/xcodegen, so ubuntu runs it fine now that the scripts'
  # one BSD-ism (sed -i '') is gone; running it on Linux is itself the
  # portability check that keeps them runnable under CI at the 1x multiplier.
  l0:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build-number failure windows
        run: Tools/tests/build-number-windows.sh

      # The accessibility gate must be able to fail (#88): its xcodebuild
      # pipeline used to end in `|| true`. Stubbed xcodebuild/xcrun, so this
      # never runs the UI-test target itself — the #14 decision keeping that
      # target out of CI stands.
      - name: Accessibility gate exit status
        run: Tools/tests/uitest-accessibility-gate.sh

      # The Secrets preflight (#89): release.sh and deploy.sh refuse to build
      # a bundle whose Secrets.plist cannot possibly hold a working key. The
      # suite carries its own plutil fallback, so ubuntu runs it fine.
      - name: Secrets preflight refusals
        run: Tools/tests/release-key-preflight.sh

      # The L2 probe's lifecycle proof (#65/#67 review): drives the real
      # livetest.run() against a LOCAL WebSocket server — deadline teardown,
      # prompt goAway closure, close-mid-send. Loopback only; no key.
      - name: Probe lifecycle against a local server
        run: |
          pip install --quiet websockets
          Tools/tests/livetest-lifecycle.py
