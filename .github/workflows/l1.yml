name: L1

# There is deliberately no L3 job. L3 talks to the live Gemini API, so it would
# need the key as a repository secret — one more place it lives. It is also
# known-flaky by design (TESTING.md §L3: one rerun is expected, twice in a row
# is a real regression), and a check that goes red on healthy code teaches you
# to ignore red checks. L3 stays a deliberate, human-judged step before a
# release.
#
# On pull requests AND on merges to main.
#
# The per-PR trigger was dropped on 2026-08-08 over cost (33 runs, zero
# failures, ~1,811 of 2,000 included minutes at the macOS 10x multiplier) and
# restored on 2026-08-10: with several concurrent AI-assisted branches, "the
# PR body states its L1 count" stopped being independently checkable, and a
# gate a reviewer cannot verify is not a gate. Doc-only changes still skip
# it,
# and superseded pushes to the same PR cancel their older runs.
#
# `pull_request` events build the PREVIEW MERGE (refs/pull/N/merge), so this
# also tests the merged result before it lands, not after. The push trigger
# stays: the preview goes stale if main moves after the last PR push, so the
# post-merge run on main remains the authoritative check of what actually
# landed.
#
# Safety, stated because it is the kind of thing that rots silently: this
# workflow must stay safe to run on code from a fork, which means
# `pull_request` (NEVER `pull_request_target` — that grants the base repo's
# write token and secrets to untrusted code), `permissions: contents: read`,
# and no step that reads `secrets.*`. The only plist it touches is the
# committed REPLACE-ME example, so nothing here can call out.
#
# An earlier version of this comment justified main-only by claiming both
# deploy.sh and release.sh already refuse to proceed without L1. That was only
# true of release.sh — deploy.sh ran no tests at all, so the local gate this
# reasoning leaned on did not exist on the path actually used a dozen times a
# day. Fixed rather than reworded: deploy.sh now runs Tools/l1.sh before it
# bumps.
on:
  pull_request:
    # Documentation cannot break a build. A large share of this project's
    # changes are TESTING.md, docs/ and findings notes.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'logs/**'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'logs/**'
      - '.gitignore'
  # Kept so a risky branch can be checked without opening a PR.
  workflow_dispatch:

# A newer push supersedes the run it obsoletes rather than paying for both —
# per PR (github.ref is refs/pull/N/merge there) and likewise for a rapid
# series of merges to main.
concurrency:
  group: l1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  l1:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # HOMEBREW_NO_AUTO_UPDATE is the saving here: `brew install` otherwise
      # refreshes the whole formula index first, which costs more wall-clock
      # than installing xcodegen does — and every wall-clock minute bills as
      # ten.
      - name: Install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen

      # Secrets.plist is gitignored, so CI never has one. L1 does not need a
      # key — AppConfig.geminiAPIKey is only read by start()/reconnect(), which
      # no L1 test reaches — but the placeholder mirrors the documented local
      # setup and stops a future test that instantiates more of the app from
      # tripping AppConfig's fatalError with a confusing CI-only failure.
      # The example's values are literally "REPLACE-ME", so nothing can call out.
      - name: Placeholder Secrets.plist
        run: cp HeikoTranslate/Resources/Secrets.plist.example HeikoTranslate/Resources/Secrets.plist

      - name: Generate the Xcode project
        run: xcodegen generate

      # Never hardcode a device name. Runner images retire simulators without
      # warning, and a pinned "iPhone 17 Pro" eventually turns into a red check
      # that has nothing to do with the code — the worst kind, because it
      # trains you to ignore the signal.
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("SimRuntime.iOS")))
            | sort_by(.key)
            | last
            | .value
            | map(select(.name | startswith("iPhone")))
            | last
            | .name // empty
          ')
          if [[ -z "$NAME" ]]; then
            echo "No iPhone simulator available on this runner image:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      # Deliberately NOT -quiet. It suppresses the "Executed N tests" summary
      # entirely, so a green check would prove only that xcodebuild exited 0 —
      # indistinguishable from a run where the bundle loaded and executed
      # nothing. A gate that cannot tell "43 passed" from "0 ran" is the same
      # failure as a test that greps source for a string and calls it coverage.
      # The explicit assertion below is what makes the check mean something.
      - name: L1 logic tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project HeikoTranslate.xcodeproj \
            -scheme HeikoTranslate \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee /tmp/l1.log

          if ! grep -qE "Executed [1-9][0-9]* tests?, with 0 failures" /tmp/l1.log; then
            echo "::error::xcodebuild exited 0 but no passing-test summary was found — nothing proves the suite actually ran."
            grep -E "Executed [0-9]+ tests?" /tmp/l1.log || true
            exit 1
          fi
          grep -E "Executed [0-9]+ tests?, with 0 failures" /tmp/l1.log | tail -1
