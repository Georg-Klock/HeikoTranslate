name: HeikoTranslate
options:
  bundleIdPrefix: com.klock
  deploymentTarget:
    iOS: "17.0"
targets:
  HeikoTranslate:
    type: application
    platform: iOS
    sources:
      - path: HeikoTranslate
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        # The second sentence names Google: App Review 5.1.2(i) requires the
        # third party to be disclosed where permission is asked (GitHub #91).
        # German-only like the rest of this description; the InfoPlist
        # localization gap is #6's, not this line's. It names the API exactly
        # as docs/privacy-policy.md does ("an die Google Gemini API"), so the
        # dialog and the published policy cannot describe the same transfer
        # in two ways. German approved by Georg 2026-08-13 (GitHub #91).
        NSMicrophoneUsageDescription: "Heiko Translate braucht Zugriff auf das Mikrofon, um gesprochene Sprache zu übersetzen. Die Sprachaufnahme wird dazu an die Google Gemini API gesendet."
        # Shown (very quietly) in the UI corner: one plain number, no build
        # in parentheses. Bump BOTH on every install to a real device, so
        # "is my phone current?" is answerable at a glance.
        CFBundleShortVersionString: "2.4"
        CFBundleVersion: "74"
        # Two letters naming the experiment this build carries, appended to
        # the pill: "2.4.75 EC". Empty on main and on anything heading for
        # TestFlight — an unmarked number is a normal build, which is the
        # common case and should not have to say so. An experiment branch
        # sets it in its own commit so a phone screen, and the log's launch
        # line, say which experiment is installed. Two letters because the
        # pill is deliberately small: E for experiment, then the initial of
        # what is being tried (EC = Experiment, Coordinator).
        HTExperimentTag: "EC"
        # The app only uses the OS's own HTTPS/TLS, which is exempt. Without
        # this key App Store Connect asks the export-compliance question on
        # every single upload and holds the build back from testers until
        # someone answers it.
        ITSAppUsesNonExemptEncryption: false
        # Lets the diagnostic log be pulled off the device (and seen in the
        # Files app) — see Tools/pull_logs.sh.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klock.heikotranslate
        PRODUCT_NAME: "Heiko Translate"
        # Explicit module name (no space) so tests can `@testable import HeikoTranslate`.
        PRODUCT_MODULE_NAME: HeikoTranslate
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  HeikoTranslateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HeikoTranslate
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen derives these from the target name; the app's PRODUCT_NAME
        # is "Heiko Translate" (with a space), so spell them out.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Heiko Translate.app/Heiko Translate"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # LOCAL-ONLY accessibility verification (#14): a UI-test target that
  # inspects the real accessibility tree — the piece no unit test can
  # reach. Deliberately NOT part of the HeikoTranslate scheme or CI (the
  # CI-spend decision stands); Tools/uitest-accessibility.sh runs it.
  HeikoTranslateAccessibilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HeikoTranslate
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HeikoTranslate
schemes:
  HeikoTranslate:
    build:
      targets:
        HeikoTranslate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeikoTranslateTests
  HeikoTranslateAccessibility:
    build:
      targets:
        HeikoTranslateAccessibilityUITests: all
    test:
      config: Debug
      targets:
        - HeikoTranslateAccessibilityUITests
