<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="machineTitle">
  <title id="machineTitle">Signal flow: the microphone feeds every 64-millisecond audio slice to both sessions; both return votes, transcripts and translated audio to TurnLogic, the referee; translated audio waits in a holding pen and plays through the loudspeaker only after the commit gate passes, producing exactly one bubble; the loudspeaker's own sound is subtracted by echo cancellation before it can re-enter the microphone.</title>
  <style>
    text { fill: #E6EDF3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t-title { font-weight: 600; font-size: 13px; }
    .t-sub { font-size: 11px; fill: #8B949E; }
    .t-label { font-size: 11px; fill: #8B949E; }
    .box { fill: #161B22; stroke: #E6EDF3; stroke-width: 1.3; }
    .box-home { stroke: #7C97F0; }
    .box-partner { stroke: #45C2A8; }
    .box-dashed { stroke: #8B949E; stroke-dasharray: 5 4; stroke-width: 1.1; }
    .flow { fill: none; stroke: #8B949E; stroke-width: 1.3; }
    .flow-signal { stroke: #E9805F; stroke-dasharray: 6 5; }
    .t-home { fill: #7C97F0; }
    .t-partner { fill: #45C2A8; }
    .t-signal { fill: #E9805F; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B949E"></path>
    </marker>
    <marker id="arr-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E9805F"></path>
    </marker>
  </defs>

  <!-- Microphone -->
  <rect class="box" x="20" y="196" width="140" height="78" rx="10"></rect>
  <text class="t-title" x="90" y="228" text-anchor="middle">Microphone</text>
  <text class="t-sub" x="90" y="248" text-anchor="middle">64 ms slices · 16 kHz</text>

  <!-- split to both sessions -->
  <path class="flow" d="M160,235 H200 V139 H234" marker-end="url(#arr)"></path>
  <path class="flow" d="M200,235 V349 H234" marker-end="url(#arr)"></path>
  <text class="t-label" x="90" y="186" text-anchor="middle">every slice, to both</text>

  <!-- Home session -->
  <rect class="box box-home" x="240" y="95" width="230" height="88" rx="10"></rect>
  <text class="t-title t-home" x="256" y="123">Home session</text>
  <text class="t-sub" x="256" y="143">target: German · one WebSocket</text>
  <text class="t-sub" x="256" y="160">truly translates only non-German</text>

  <!-- Partner session -->
  <rect class="box box-partner" x="240" y="305" width="230" height="88" rx="10"></rect>
  <text class="t-title t-partner" x="256" y="333">Partner session</text>
  <text class="t-sub" x="256" y="353">target: English · one WebSocket</text>
  <text class="t-sub" x="256" y="370">truly translates only non-English</text>

  <!-- sessions → TurnLogic -->
  <path class="flow" d="M470,139 H505 V206 H536" marker-end="url(#arr)"></path>
  <path class="flow" d="M470,349 H505 V250 H536" marker-end="url(#arr)"></path>
  <text class="t-label" x="504" y="222" text-anchor="middle">votes ·</text>
  <text class="t-label" x="504" y="236" text-anchor="middle">transcripts</text>

  <!-- TurnLogic -->
  <rect class="box" x="540" y="178" width="200" height="84" rx="10" stroke-width="1.8"></rect>
  <text class="t-title" x="640" y="208" text-anchor="middle">TurnLogic — the referee</text>
  <text class="t-sub" x="640" y="228" text-anchor="middle">which language was spoken?</text>
  <text class="t-sub" x="640" y="243" text-anchor="middle">whose output is the translation?</text>

  <!-- holding pen -->
  <rect class="box box-dashed" x="540" y="316" width="200" height="64" rx="10"></rect>
  <text class="t-title" x="640" y="342" text-anchor="middle" font-size="12.5">Holding pen</text>
  <text class="t-sub" x="640" y="360" text-anchor="middle">translated audio waits · ≤ 40 s</text>
  <path class="flow" d="M640,262 V312" marker-end="url(#arr)"></path>
  <text class="t-label" x="652" y="292">audio held</text>

  <!-- TurnLogic → Commit -->
  <path class="flow" d="M740,220 H766" marker-end="url(#arr)"></path>

  <!-- Commit gate -->
  <rect class="box" x="770" y="178" width="150" height="84" rx="10"></rect>
  <text class="t-title" x="845" y="208" text-anchor="middle">Commit gate</text>
  <text class="t-sub" x="845" y="228" text-anchor="middle">4 checks must pass</text>
  <text class="t-sub" x="845" y="243" text-anchor="middle">exactly one bubble (R1)</text>

  <!-- Commit → bubble -->
  <path class="flow" d="M845,178 V118" marker-end="url(#arr)"></path>
  <rect class="box" x="775" y="48" width="140" height="64" rx="18"></rect>
  <text class="t-title" x="845" y="75" text-anchor="middle" font-size="12.5">One bubble</text>
  <text class="t-sub" x="845" y="93" text-anchor="middle">German right · foreign left</text>

  <!-- pen → speaker -->
  <path class="flow" d="M740,348 H776" marker-end="url(#arr)"></path>
  <rect class="box" x="780" y="316" width="140" height="64" rx="10"></rect>
  <text class="t-title" x="850" y="342" text-anchor="middle" font-size="12.5">Loudspeaker</text>
  <text class="t-sub" x="850" y="360" text-anchor="middle">committed audio only</text>

  <!-- AEC return -->
  <path class="flow flow-signal" d="M850,380 V440 H90 V280" marker-end="url(#arr-sig)"></path>
  <text class="t-label t-signal" x="470" y="432" text-anchor="middle">the phone's own voice — subtracted by hardware echo cancellation, never re-translated (R6)</text>
</svg>
